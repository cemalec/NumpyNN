layers:
  - name: input
    type: DenseLayer
    input_size: 784
    output_size: 64
    activation_function: ReLU
  - name: hidden
    type: DenseLayer
    input_size: 64
    output_size: 32
    activation_function: ReLU
  - name: output
    type: DenseLayer
    input_size: 32
    output_size: 10
    activation_function: SoftMax
loss: CrossEntropyLoss
optimizer:
  type: Adam
  learning_rate: 3e-6
  beta1: 0.9
  beta2: 0.999
  epsilon: 1e-8
